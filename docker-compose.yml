services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      AQI_LIVE: "1"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./reports:/app/reports
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  dashboard:
    build: .
    command: ["streamlit", "run", "app/dashboard.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    environment:
      AQI_API_URL: "http://api:8000"
    depends_on:
      - api
    volumes:
      - ./reports:/app/reports
      - ./data:/app/data
