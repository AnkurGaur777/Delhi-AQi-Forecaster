name: daily-refresh
on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt && pip install -e .
      - run: python -m aqi.pipeline download
      - run: python -m aqi.pipeline clean
      - uses: actions/upload-artifact@v4
        with:
          name: latest-data-metadata
          path: data/raw/metadata.json
